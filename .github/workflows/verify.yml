name: Verify Flutter source
on: [push, pull_request, workflow_dispatch]
jobs:
  android-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: bash scripts/bootstrap.sh
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage
      - name: Show full failure detail
        if: failure()
        run: flutter test --reporter expanded test/widget/app_smoke_test.dart
      - run: flutter build apk --debug
      - run: flutter build web
      - uses: actions/upload-artifact@v4
        with:
          name: pazel-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info


  release-apk:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: android-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: bash scripts/bootstrap.sh
      - run: flutter build apk --debug --dart-define=APP_ENV=demo
      - uses: actions/upload-artifact@v4
        with:
          name: pazel-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
