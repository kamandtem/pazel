name: pazel
description: Persian offline-first personal study workspace.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  sembast: ^3.8.4
  sembast_web: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.1
  shamsi_date: ^1.0.4
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
